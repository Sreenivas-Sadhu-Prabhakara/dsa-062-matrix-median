<text x="151.5" y="338.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">row 1: ≤5 → 3</text>
<rect x="229.0" y="319.0" width="135.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="296.5" y="338.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">row 2: ≤5 → 1</text>
<rect x="374.0" y="319.0" width="135.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="441.5" y="338.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">row 3: ≤5 → 1</text>
<rect x="519.0" y="319.0" width="153.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="595.5" y="338.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">total → 5 ≥ 5 ✓</text>
<line x1="24.0" y1="363.0" x2="736.0" y2="363.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="383.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
