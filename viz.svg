<text x="56.0" y="265.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Binary search over the VALUE range 1..9. For a candidate value, count elements ≤ it</text>
<text x="56.0" y="284.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">with a binary search per row: candidate 5 → 3+1+1 = 5 counts — enough, go lower to</text>
<text x="56.0" y="303.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">find the smallest such value.</text>
<text x="72.0" y="338.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">count for 5</text>
