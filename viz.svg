<text x="56.0" y="388.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">The smallest value with count ≥ 5 is the median: 5. Two nested binary searches — one</text>
<text x="56.0" y="407.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">over values, one over each row — O(32 · rows · log cols).</text>
